<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Mesa de los Dos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Parisienne&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#231016;
    --night-2:#2f1720;
    --card:#341922;
    --gold:#c8a25e;
    --gold-soft:#e6cd97;
    --blush:#f3e7da;
    --muted:#c3a498;
    --line:rgba(200,162,94,0.28);
    --line-soft:rgba(200,162,94,0.14);
    /* acento por defecto (se sobreescribe por carta) */
    --acc:#c8a25e;
    --acc-soft:#e6cd97;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:
      radial-gradient(circle at 12% 2%, rgba(199,126,143,0.12) 0%, transparent 42%),
      radial-gradient(circle at 88% 98%, rgba(209,160,79,0.12) 0%, transparent 46%),
      radial-gradient(circle at 50% -10%, #3a1d27 0%, transparent 55%),
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2226%22%20height%3D%2226%22%20viewBox%3D%220%200%2026%2026%22%3E%3Ccircle%20cx%3D%221%22%20cy%3D%221%22%20r%3D%221%22%20fill%3D%22rgba%28200%2C162%2C94%2C0.06%29%22/%3E%3C/svg%3E"),
      var(--night);
    background-attachment:fixed, fixed, fixed, fixed, fixed;
    color:var(--blush);
    font-family:'Karla',system-ui,sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding:clamp(2rem,5vw,5rem) 1.25rem 5rem;
  }

  .wrap{max-width:1040px;margin:0 auto}

  /* ---------- Encabezado ---------- */
  .hero{text-align:center;margin-bottom:clamp(3rem,7vw,5.5rem)}

  .hero .flourish{
    color:var(--gold);
    font-size:1.6rem;
    letter-spacing:.5em;
    margin-bottom:1.2rem;
    opacity:.85;
  }

  .hero h1{
    font-family:'Parisienne',cursive;
    font-weight:400;
    font-size:clamp(3.4rem,9vw,6rem);
    line-height:1.05;
    color:var(--gold-soft);
  }

  .hero .sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(1.15rem,3vw,1.55rem);
    color:var(--muted);
    margin-top:.9rem;
  }

  .hero .cities{
    font-size:.9rem;
    color:var(--muted);
    margin-top:1.6rem;
    letter-spacing:.04em;
  }

  .hero .cities .ciudad{
    color:var(--gold-soft);
    font-weight:700;
  }

  .invite{
    max-width:34ch;
    margin:clamp(2.6rem,6vw,4rem) auto 0;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(1.3rem,3.4vw,1.7rem);
    line-height:1.35;
    color:var(--blush);
  }

  /* ---------- Cartas cerradas ---------- */
  .deck{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1.5rem;
  }

  .card{
    position:relative;
    background:
      linear-gradient(160deg, var(--card) 0%, var(--night-2) 100%);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3rem 1.5rem;
    min-height:340px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    color:inherit;
    font:inherit;
    transition:transform .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:9px;
    border:1px solid var(--acc);
    opacity:.22;
    border-radius:3px;
    pointer-events:none;
    transition:opacity .35s ease;
  }

  .card:hover,.card:focus-visible{
    transform:translateY(-6px);
    border-color:var(--acc);
    box-shadow:0 18px 40px -20px rgba(0,0,0,.8), 0 0 34px -12px var(--acc);
    outline:none;
  }
  .card:hover::before,.card:focus-visible::before{opacity:.55}

  .card .mark{
    color:var(--acc);
    font-size:1.1rem;
    letter-spacing:.4em;
    margin-bottom:1.6rem;
    opacity:.85;
  }

  .card .title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.8rem,3.2vw,2.2rem);
    line-height:1.2;
    color:var(--acc-soft);
  }

  .card .open{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.05rem;
    color:var(--muted);
    margin-top:1.8rem;
  }

  /* ---------- Vista de detalle ---------- */
  .detail-scrim{
    position:fixed;
    inset:0;
    background:rgba(15,7,10,.82);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(1rem,4vw,3rem) 1rem;
    overflow-y:auto;
    z-index:50;
    opacity:0;
    visibility:hidden;
    transition:opacity .3s ease, visibility 0s linear .3s;
  }
  .detail-scrim.show{
    opacity:1;
    visibility:visible;
    transition:opacity .3s ease, visibility 0s;
  }

  .detail{
    outline:none;
    background:
      linear-gradient(170deg, var(--night-2) 0%, var(--night) 100%);
    border:1px solid var(--acc);
    border-radius:8px;
    max-width:640px;
    width:100%;
    padding:clamp(2rem,5vw,3.2rem);
    transform:scale(.92);
    opacity:0;
    transition:transform .4s cubic-bezier(.2,.8,.25,1), opacity .4s ease;
  }
  .detail-scrim.show .detail{transform:scale(1);opacity:1}

  .detail .back{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Karla',sans-serif;
    font-size:.9rem;
    cursor:pointer;
    padding:.3rem 0;
    margin-bottom:1.8rem;
    letter-spacing:.03em;
  }
  .detail .back:hover{color:var(--acc-soft)}

  .detail .d-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(2.1rem,5vw,2.8rem);
    line-height:1.15;
    color:var(--acc-soft);
    text-align:center;
  }

  .detail .message{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(1.2rem,3vw,1.45rem);
    line-height:1.4;
    color:var(--blush);
    text-align:center;
    max-width:40ch;
    margin:1.2rem auto 0;
  }

  .rule{
    width:56px;
    height:1px;
    background:var(--acc);
    opacity:.7;
    margin:2.4rem auto;
    border:none;
  }

  .section-label{
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem;
    color:var(--acc);
    margin-bottom:1rem;
  }

  .lead{color:var(--muted);font-size:.95rem;margin-bottom:1rem}

  /* Acordeón de recetas */
  .recipe{
    border-top:1px solid var(--line-soft);
  }
  .recipe:last-child{border-bottom:1px solid var(--line-soft)}

  .recipe-head{
    width:100%;
    background:none;
    border:none;
    color:var(--blush);
    font-family:'Karla',sans-serif;
    text-align:left;
    padding:1.1rem .3rem;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:1rem;
  }
  .recipe-head:hover .r-name{color:var(--acc-soft)}

  .r-name{font-size:1.08rem;font-weight:500;transition:color .2s ease}
  .r-time{font-size:.82rem;color:var(--muted);white-space:nowrap}
  .r-plus{color:var(--acc);font-size:1.2rem;line-height:1;transition:transform .3s ease}
  .recipe.open .r-plus{transform:rotate(45deg)}

  .recipe-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .35s ease;
  }
  .recipe.open .recipe-body{grid-template-rows:1fr}
  .recipe-body>div{overflow:hidden}

  .recipe-inner{padding:.2rem .3rem 1.6rem}

  .recipe-foto{
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    border-radius:6px;
    border:1px solid var(--line);
    display:block;
    margin:.4rem 0 .6rem;
  }
  .foto-empty{
    width:100%;
    aspect-ratio:16/10;
    border:1px dashed var(--line);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-style:italic;
    font-size:.9rem;
    margin:.4rem 0 .6rem;
    background:rgba(0,0,0,.12);
  }

  .foto-duo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.6rem;
    margin:.4rem 0 .6rem;
  }
  .foto-duo .recipe-foto{
    margin:0;
    aspect-ratio:4/3;
  }
  @media(max-width:520px){
    .foto-duo{grid-template-columns:1fr}
  }

  .mini-label{
    color:var(--acc);
    font-size:.8rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:1rem 0 .5rem;
  }
  .recipe-inner ul{list-style:none;padding:0}
  .recipe-inner ul li{
    padding-left:1.1rem;position:relative;color:var(--blush);
    font-size:.95rem;margin-bottom:.25rem;
  }
  .recipe-inner ul li::before{
    content:"";position:absolute;left:0;top:.65em;
    width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.8;
  }
  .recipe-inner ol{padding-left:1.2rem;color:var(--blush);font-size:.95rem}
  .recipe-inner ol li{margin-bottom:.45rem;padding-left:.2rem}

  .video-row{margin-top:1.3rem;display:flex;flex-wrap:wrap;gap:.6rem}
  .video-link{
    display:inline-block;
    color:var(--night);
    background:var(--acc);
    text-decoration:none;
    font-weight:700;
    font-size:.9rem;
    padding:.55rem 1.1rem;
    border-radius:4px;
    transition:background .2s ease;
  }
  .video-link:hover{background:var(--acc-soft)}
  .video-empty{
    display:inline-block;
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:4px;
    padding:.55rem 1.1rem;
    font-size:.88rem;
    font-style:italic;
  }

  /* Bloques finales */
  .pair{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1.5rem 2rem;
    margin-top:.5rem;
  }
  .pair .block p{color:var(--blush);font-size:.98rem}

  @media(max-width:720px){
    .deck{grid-template-columns:1fr;max-width:380px;margin:0 auto}
    .card{min-height:200px;padding:2.4rem 1.5rem}
    .pair{grid-template-columns:1fr;gap:1.6rem}
  }

  @media(prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

    <header class="hero">

      <h1>La Mesa de los Dos</h1>
      <p class="sub">Un restaurante que abre una sola noche, solo para nosotros.</p>

    <p class="invite">Elige una carta, la que tú quieras.</p>

  </div>

  <!-- Vista de detalle -->
  <div class="detail-scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="d-title">

          "Sal, pimienta y orégano",
          "½ taza de salsa bechamel comprada (no hay que hacerla)",
          "100 g de queso mozzarella rallado",
          "Queso parmesano rallado para gratinar",
          "Aceite de oliva"
        ],
        pasos: [
          "Sofríe la cebolla y el ajo en un poco de aceite de oliva hasta que estén transparentes.",
          "Agrega la carne molida, salpimienta y cocina hasta que dore.",
          "Añade la salsa de tomate y el orégano, y deja reducir 15 min a fuego bajo.",
          "En un molde pequeño arma las capas: bechamel, láminas, carne, mozzarella. Repite hasta llenar.",
          "Termina con bechamel, mozzarella y parmesano por encima.",
          "Hornea a 180°C por 35 min, tapado con aluminio los primeros 20.",
          "Deja reposar 10 min antes de servir, para que corte bien."
        ]
      },
      {
        nombre: "Pollo alla Marsala con pasta",
        tiempo: "30 min",
        video: "https://www.tiktok.com/@foodcreationsforyou/video/7343700270095846699?_r=1&_t=ZS-99TqAzNboP9",
        foto: "img/pollo-alla-marsala-con-pasta.jpg",
        ingredientes: [
          "250 g de pechuga en filetes",
          "Sal, pimienta",
          "100 g de champiñones",
          "50 ml de vino Marsala (o vino tinto)",
          "50 ml de crema de leche",
          "100 g de pasta"
        ],
        pasos: [
          "Dora la pechuga salpimentada y retira.",
          "Saltea los champiñones, agrega el vino y la crema, deja reducir.",
          "Regresa el pollo y sirve con pasta al lado."
        ]
      }
    ]
  }
];

/* ============================================================
   Render
   ============================================================ */

const deck = document.getElementById('deck');
const scrim = document.getElementById('scrim');
const detail = document.getElementById('detail');

CARTAS.forEach((carta, i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'card';
  btn.style.setProperty('--acc', carta.acc);
  btn.style.setProperty('--acc-soft', carta.accSoft);
  btn.innerHTML = `
    <span class="mark">✦</span>
    <span class="title">${carta.titulo}</span>
    <span class="open">Ábreme</span>
  `;
  btn.addEventListener('click', () => abrir(i));
  deck.appendChild(btn);
});

let ultimoFoco = null;

function abrir(i){
  const c = CARTAS[i];
  ultimoFoco = document.activeElement;

  detail.style.setProperty('--acc', c.acc);
  detail.style.setProperty('--acc-soft', c.accSoft);

  const recetasHTML = c.recetas.map((r, idx) => {
    const ing = r.ingredientes.map(x => `<li>${x}</li>`).join('');
    const pas = r.pasos.map(x => `<li>${x}</li>`).join('');
    let video;
    if (Array.isArray(r.videos)) {
      video = r.videos.map(v => `<a class="video-link" href="${v.url}" target="_blank" rel="noopener">Ver video: ${v.etiqueta} ▸</a>`).join(' ');
    } else if (r.video) {
      video = `<a class="video-link" href="${r.video}" target="_blank" rel="noopener">Ver video ▸</a>`;
    } else {
      video = '';
    }
    const foto = Array.isArray(r.foto)
      ? `<div class="foto-duo">${r.foto.map((src, j) => `<img class="recipe-foto" src="${src}" alt="${r.nombre} (${j+1} de ${r.foto.length})" loading="lazy">`).join('')}</div>`
      : (r.foto
        ? `<img class="recipe-foto" src="${r.foto}" alt="${r.nombre}" loading="lazy">`
        : `<div class="foto-empty">Foto por agregar</div>`);
    return `
      <div class="recipe" data-r="${idx}">
        <button type="button" class="recipe-head" aria-expanded="false" onclick="toggleReceta(${idx})">
          <span class="r-name">${r.nombre}</span>
          <span style="display:flex;gap:.9rem;align-items:baseline">
            <span class="r-time">${r.tiempo}</span>
            <span class="r-plus">+</span>
          </span>
        </button>
        <div class="recipe-body"><div>
          <div class="recipe-inner">
            ${foto}
            <div class="mini-label">Ingredientes (1 persona)</div>
            <ul>${ing}</ul>
            <div class="mini-label">Preparación</div>
            <ol>${pas}</ol>
            ${video ? `<div class="video-row">${video}</div>` : ''}
          </div>
        </div></div>
      </div>`;
  }).join('');

  detail.innerHTML = `
    <button type="button" class="back" onclick="cerrar()">← Volver a las cartas</button>
    <h2 class="d-title" id="d-title">${c.titulo}</h2>
    <p class="message">${c.mensaje}</p>
    <hr class="rule">

    <div class="section-label">Esta noche cocinamos</div>
    <p class="lead">Elijamos juntos una de las tres y vemos qué trae.</p>
    ${recetasHTML}

    <hr class="rule">
    <div class="pair">
      <div class="block">
        <div class="section-label">Para brindar</div>
        <p>${c.trago}</p>
      </div>
      <div class="block">
        <div class="section-label">Código de vestuario</div>
        <p>${c.dress}</p>
      </div>
      <div class="block" style="grid-column:1/-1">
        <div class="section-label">Para ambientar</div>
        <p>${c.ambiente}</p>
      </div>
    </div>
  `;

  scrim.classList.add('show');
  scrim.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  detail.focus();
}

function toggleReceta(idx){
  const el = detail.querySelector(`.recipe[data-r="${idx}"]`);
  const abierta = el.classList.toggle('open');
  el.querySelector('.recipe-head').setAttribute('aria-expanded', abierta);
}

function cerrar(){
  if(!scrim.classList.contains('show')) return;
  scrim.classList.remove('show');
  document.body.style.overflow = '';
  if(ultimoFoco) ultimoFoco.focus();
}

scrim.addEventListener('click', e => { if(e.target === scrim) cerrar(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
</script>
</body>
